; cxauto 配置文件。复制为 config.ini 后填写账号即可使用。

[common]
; 学习通账号（手机号或学号）与密码
username =
password =

; 只刷指定课程（课程名用英文逗号分隔，留空 = 刷全部课程）
; 示例：course_list = 高等数学, 大学英语
course_list =

; 要自动完成的任务类型（逗号分隔）。默认只刷视频：video
; 可选值：video（视频/音频）、document（文档）、read（阅读）
; 按用户要求默认只刷视频，其他任务不碰
job_types = video

; 视频倍速，范围 1.0 ~ 2.0（官方前端最多 2 倍速，超速极易触发风控）
speed = 1.0

; 单个任务点最大重试次数
max_retries = 3

; 失败任务重试间隔（秒）
retry_interval = 2

; 章节未开放时的处理：skip（跳过该章节继续）/ stop（停止当前课程）
notopen_action = skip

; 并行刷课线程数（同时刷几个视频）。同一账号不建议超过 3，越大风控风险越高
concurrency = 1

; 登录态持久化文件（复用 Cookie 可避免频繁登录触发风控）
cookie_file = cookies.txt

; 运行日志
log_file = logs/cxauto.log
log_level = INFO
